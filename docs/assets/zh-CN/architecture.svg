  <rect class="panel" x="28" y="266" width="1224" height="278" rx="10"/>
  <text class="sec" x="48" y="292">中枢三阶 · 五轨并行预备管线 (CPU / Web Worker 并行计算 vs 单上下文 GPU 串行边界)</text>

  <rect class="card-jade" x="48" y="308" width="224" height="216" rx="8"/>
  <text class="t-title" x="64" y="332">A轨 · 数学与SDF审计</text>
  <text class="t-body" x="64" y="358">04-subject-audit.md</text>
  <text class="t-muted" x="64" y="382">• 李雅普诺夫有界稳定性</text>
  <text class="t-muted" x="64" y="404">• 4采样四面体SDF法线</text>
  <text class="t-muted" x="64" y="426">• 消除6采样轴向梯度</text>
  <text class="t-muted" x="64" y="448">• 声学/流体CFL步长边界</text>
  <text class="t-body" x="64" y="496">输出：解析不变量契约</text>

  <rect class="card-gold" x="288" y="308" width="224" height="216" rx="8"/>
  <text class="t-title" x="304" y="332">B轨 · 着色器与UBO契约</text>
  <text class="t-body" x="304" y="358">05-shader-rules.md</text>
  <text class="t-muted" x="304" y="382">• #version 300 es 契约</text>
  <text class="t-muted" x="304" y="404">• layout(std140) 16B对齐</text>
  <text class="t-muted" x="304" y="426">• 分支前预计算 dFdx/dFdy</text>
  <text class="t-muted" x="304" y="448">• 命名常量与推导注释</text>
  <text class="t-body" x="304" y="496">输出：零魔法数字GLSL</text>

  <rect class="card-jade" x="528" y="308" width="224" height="216" rx="8"/>
  <text class="t-title" x="544" y="332">C轨 · 通道图与FBO内存</text>
  <text class="t-body" x="544" y="358">03 &amp; 06-runtime-ops.md</text>
  <text class="t-muted" x="544" y="382">• gl.texStorage2D 不可变</text>
  <text class="t-muted" x="544" y="404">• checkFramebufferStatus</text>
  <text class="t-muted" x="544" y="426">• 移动端 invalidateFBO</text>
  <text class="t-muted" x="544" y="448">• Ping-Pong 读写解耦</text>
  <text class="t-body" x="544" y="496">输出：6通道确定性拓扑</text>

  <rect class="card-gold" x="768" y="308" width="224" height="216" rx="8"/>
  <text class="t-title" x="784" y="332">D轨 · 带宽与降级策略</text>
  <text class="t-body" x="784" y="358">02-hardware-budget.md</text>
  <text class="t-muted" x="784" y="382">• 显存带宽 GB/s 核算</text>
  <text class="t-muted" x="784" y="404">• KTX2 BasisU 压缩纹理</text>
  <text class="t-muted" x="784" y="426">• 半分辨率体积光降级</text>
  <text class="t-muted" x="784" y="448">• 销毁链 deleteTexture</text>
  <text class="t-body" x="784" y="496">输出：帧时间安全边界</text>

  <rect class="card-cyan" x="1008" y="308" width="224" height="216" rx="8"/>
  <text class="t-title" x="1024" y="332">E轨 · 异步验证与CI门禁</text>
  <text class="t-body" x="1024" y="358">07-validation-and-ci.md</text>
  <text class="t-muted" x="1024" y="382">• PBO + fenceSync(0ns)</text>
  <text class="t-muted" x="1024" y="404">• WEBGL_lose_context 演练</text>
  <text class="t-muted" x="1024" y="426">• 24项 validate_repo.py</text>
