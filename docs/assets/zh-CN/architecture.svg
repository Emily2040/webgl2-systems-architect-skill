  <rect class="panel" x="28" y="108" width="1224" height="140" rx="10"/>
  <text class="sec" x="48" y="132">外环一至二阶 · 6×6 意图分诊路由与硬件帧预算红线门禁 (skills/core/01-triage.md &amp; 02-hardware-budget.md)</text>

  <rect class="card-jade" x="48" y="146" width="275" height="86" rx="8"/>
  <text class="t-title" x="64" y="168">01 · 渐进式披露入口 (SKILL.md)</text>
  <text class="t-body" x="64" y="190">加载 locales/zh-CN/ 中文规范包</text>
  <text class="t-muted" x="64" y="210">拒绝全量上下文噪音 · 严守不变量</text>

  <rect class="card-jade" x="345" y="146" width="285" height="86" rx="8"/>
