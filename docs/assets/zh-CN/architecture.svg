  <!-- Stage 4 & 5: Inner Ring Serial GL Submission & Verification -->
  <rect class="panel-gold" x="28" y="562" width="1224" height="274" rx="10"/>
  <text class="sec" x="48" y="588">内环四至五阶 · 单 WebGL 2.0 上下文串行提交总线与 WebGPU 双栈演进契约</text>

  <rect class="card-jade" x="48" y="606" width="370" height="110" rx="8"/>
  <text class="t-title" x="64" y="630">单上下文串行 GL 提交核心 (主线程/Offscreen)</text>
  <text class="t-body" x="64" y="654">1. bindVertexArray(vao) 专属 VAO 常驻绑定</text>
  <text class="t-body" x="64" y="676">2. bufferSubData 更新 16B 对齐 std140 UBO</text>
  <text class="t-muted" x="64" y="698">3. 链接后立即 detachShader + deleteShader</text>

  <rect class="card-gold" x="442" y="606" width="380" height="110" rx="8"/>
  <text class="t-title" x="458" y="630">6通道固定顺序帧执行管线 (Pass 1..6)</text>
  <text class="t-body" x="458" y="654">Shadow/SDF -&gt; G-Buffer MRT -&gt; 照明合成</text>
  <text class="t-body" x="458" y="676">-&gt; 半透明混合 -&gt; 后处理链 -&gt; 最终上屏</text>
  <text class="t-muted" x="458" y="698">严禁同一纹理在单通道内同时绑为采样器与附件</text>

  <rect class="card-cyan" x="846" y="606" width="386" height="110" rx="8"/>
  <text class="t-title" x="862" y="630">非阻塞 PBO 回读与 WebGPU 1:1 映射</text>
  <text class="t-body" x="862" y="654">gl.readPixels -&gt; PIXEL_PACK_BUFFER (0偏移)</text>
  <text class="t-body" x="862" y="676">gl.clientWaitSync(fence, 0, 0) 零阻塞轮询</text>
  <text class="t-muted" x="862" y="698">隔离深度 [-1,1]-&gt;[0,1] 与 UV 翻转以无缝迁往 WGSL</text>

  <rect class="card-jade" x="48" y="732" width="1184" height="86" rx="8"/>
  <text class="t-title" x="68" y="756">双模型输出契约与全仓验证闭环 (schemas/authoring-base.json &amp; runtime-compact.json)</text>
  <text class="t-body" x="68" y="780">支持 locale="zh-CN" · 完整覆盖 4 组端到端黄金案例 (face-raymarch / terrain-midrange / postprocess-context-loss / webgpu-migration-hybrid)</text>
  <text class="t-muted" x="68" y="802">验证命令：python scripts/validate_repo.py -&gt; 24项全绿通过 · glError == 0 · XML与文本框边界校验100%合格</text>
