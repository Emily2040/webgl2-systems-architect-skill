  <text class="t-body" x="361" y="190">architecture / debug / optimize</text>
  <text class="t-muted" x="361" y="210">review / implement / migration</text>

  <rect class="card-gold" x="652" y="146" width="285" height="86" rx="8"/>
  <text class="t-title" x="668" y="168">03 · 帧预算与动态 DPR 钳制</text>
  <text class="t-body" x="668" y="190">gpuBudgetMs = 12.67ms @ 60Hz</text>
  <text class="t-muted" x="668" y="210">targetDPR &lt;= 2.0 · 显存带宽精算</text>

  <rect class="card-cyan" x="959" y="146" width="273" height="86" rx="8"/>
