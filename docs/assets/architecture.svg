  <rect class="panel" x="40" y="256" width="1200" height="264" rx="10" />
  <text class="sec" x="60" y="282">STAGE 02 // FIVE INDEPENDENT ANALYSIS LANES (LOADED SELECTIVELY BY INTENT)</text>

  <!-- Lane A -->
  <rect class="card" x="60" y="298" width="216" height="202" rx="8" />
  <text class="mono" x="76" y="322">LANE A · HARDWARE</text>
  <text class="title" x="76" y="344">Budget &amp; Limits</text>
  <text class="mono-teal" x="76" y="364">02-hardware-budget.md</text>
  <text class="body" x="76" y="388">· gl.getParameter limits</text>
  <text class="body" x="76" y="408">· Disjoint timer queries</text>
  <text class="body" x="76" y="428">· 16.67ms frame math</text>
  <text class="body" x="76" y="448">· Dynamic targetDPR</text>
  <text class="body" x="76" y="468">· Low / Mid / High tiers</text>

  <!-- Lane B -->
  <rect class="card" x="296" y="298" width="216" height="202" rx="8" />
  <text class="mono" x="312" y="322">LANE B · SUBJECT</text>
  <text class="title" x="312" y="344">Visual Hierarchy</text>
  <text class="mono-teal" x="312" y="364">04-subject-audit.md</text>
  <text class="body" x="312" y="388">· 5 observable layers</text>
  <text class="body" x="312" y="408">· P0 identity silhouette</text>
  <text class="body" x="312" y="428">· P1 material &amp; depth</text>
  <text class="body" x="312" y="448">· P2 luxury micro-polish</text>
  <text class="body" x="312" y="468">· Deterministic cut order</text>

  <!-- Lane C -->
  <rect class="card" x="532" y="298" width="216" height="202" rx="8" />
  <text class="mono" x="548" y="322">LANE C · PIPELINE</text>
  <text class="title" x="548" y="344">Pass Graph &amp; Boot</text>
  <text class="mono-teal" x="548" y="364">03-pipeline-concurrency</text>
  <text class="body" x="548" y="388">· Context attr selection</text>
  <text class="body" x="548" y="408">· Worker decode &amp; cull</text>
  <text class="body" x="548" y="428">· COMPLETION_STATUS_KHR</text>
  <text class="body" x="548" y="448">· PBO + fenceSync pipe</text>
  <text class="body" x="548" y="468">· Frame-1 bootstrap flow</text>

  <!-- Lane D -->
  <rect class="card" x="768" y="298" width="216" height="202" rx="8" />
  <text class="mono" x="784" y="322">LANE D · SHADER &amp; OPS</text>
  <text class="title" x="784" y="344">GLSL &amp; Lifecycle</text>
  <text class="mono-teal" x="784" y="364">05-shader + 06-runtime</text>
  <text class="body" x="784" y="388">· #version 300 es + std140</text>
  <text class="body" x="784" y="408">· Pre-branch textureGrad</text>
  <text class="body" x="784" y="428">· VAO / UBO / texStorage2D</text>
  <text class="body" x="784" y="448">· invalidateFramebuffer</text>
  <text class="body" x="784" y="468">· WebGPU bind-group map</text>

  <!-- Lane E -->
  <rect class="card" x="1004" y="298" width="216" height="202" rx="8" />
  <text class="mono" x="1020" y="322">LANE E · VERIFICATION</text>
  <text class="title" x="1020" y="344">Validation &amp; CI</text>
  <text class="mono-teal" x="1020" y="364">07-validation-and-ci.md</text>
  <text class="body" x="1020" y="388">· Compile &amp; link logs</text>
  <text class="body" x="1020" y="408">· checkFramebufferStatus</text>
  <text class="body" x="1020" y="428">· Center-pixel smoke test</text>
  <text class="body" x="1020" y="448">· WEBGL_lose_context drill</text>
  <text class="body" x="1020" y="468">· Negative repo self-tests</text>

  <!-- ROW 3: Runtime Concurrency Model (Parallel CPU/PBO vs Serial GL Queue) -->
  <rect class="panel" x="40" y="548" width="1200" height="152" rx="10" />
  <text class="sec" x="60" y="574">STAGE 03 // HONEST WEBGL 2.0 CONCURRENCY MODEL (PARALLEL PREP VS SERIAL CONTEXT SUBMISSION)</text>

  <rect class="card-teal" x="60" y="590" width="560" height="92" rx="8" />
  <text class="title" x="78" y="614">Parallel &amp; Pipelined Lanes (Workers + Async GPU)</text>
  <text class="body" x="78" y="636">· Web Workers: fetch, glTF/Draco decode, KTX2, BVH &amp; chunk build</text>
  <text class="body" x="78" y="656">· Async GPU: KHR_parallel_shader_compile &amp; PBO + gl.fenceSync</text>

  <rect class="card-amber" x="660" y="590" width="560" height="92" rx="8" />
  <text class="title" x="678" y="614">Strictly Serial on Single WebGL2RenderingContext</text>
  <text class="body" x="678" y="636">· Sorted state: FBO target -&gt; Program -&gt; UBO/Samplers -&gt; VAO -&gt; Draw</text>
  <text class="body" x="678" y="656">· Resource uploads (texSubImage2D, bufferSubData) &amp; FBO pass chain</text>

  <line class="wire-teal" x1="620" y1="636" x2="658" y2="636" />

  <!-- ROW 4: Merge Order, Anti-Slop Gate & Validated Output Contracts -->
  <rect class="panel" x="40" y="724" width="1200" height="108" rx="10" />
  <text class="sec" x="60" y="748">STAGE 04 // DETERMINISTIC MERGE ORDER, ANTI-SLOP GATE &amp; OUTPUT CONTRACTS</text>

  <rect class="card" x="60" y="762" width="368" height="54" rx="8" />
  <text class="title" x="78" y="784">1. Merge Order (Constraints -&gt; Patch)</text>
  <text class="body" x="78" y="804">Ranked by measured GPU evidence tier</text>

  <rect class="card" x="456" y="762" width="368" height="54" rx="8" />
  <text class="title" x="474" y="784">2. Four-Locale Anti-Slop Gate</text>
  <text class="mono" x="474" y="804">registry/forbidden-slop.json (en/zh-CN/ja/ko)</text>

  <rect class="card-cyan" x="852" y="762" width="368" height="54" rx="8" />
  <text class="title" x="870" y="784">3. Schema-Validated Deliverables</text>
  <text class="mono" x="870" y="804">authoring-base.json · runtime-compact.json</text>

  <line class="wire" x1="428" y1="789" x2="454" y2="789" />
  <line class="wire" x1="824" y1="789" x2="850" y2="789" />
