  <text class="h1" x="52" y="50">WebGL 2.0 系统架构师 · 双环五阶玄玉金枢架构蓝图 (v2.0.0)</text>
  <text class="sub" x="52" y="74">外环：6×6 意图分诊与 12.67ms 帧预算红线 · 中枢：五轨 Worker 并行预备 · 内环：单上下文串行 GL 提交与零阻塞 PBO 验证</text>
  <rect class="card-jade" x="1010" y="34" width="220" height="44" rx="8"/>
