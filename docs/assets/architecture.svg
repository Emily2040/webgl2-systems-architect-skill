<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">WebGL 2.0 Systems Architect — Routed Lane &amp; GPU Execution Architecture</title>
  <desc id="arch-desc">Technical blueprint showing the router entrypoint, four-language locale dispatch, triage across six intents and six project classes, five parallel analysis lanes, single-context WebGL2 serialization versus worker/PBO concurrency, and validated JSON output contracts.</desc>
  <defs>
    <style>
      .bg { fill: #090d14; }
      .grid-line { stroke: #111a29; stroke-width: 1; }
      .panel { fill: #0f1622; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .card { fill: #131c2e; stroke: #26354d; stroke-width: 1.25; rx: 8; }
      .card-cyan { fill: #0d1f33; stroke: #0284c7; stroke-width: 1.5; rx: 8; }
      .card-teal { fill: #0b2228; stroke: #0d9488; stroke-width: 1.5; rx: 8; }
      .card-amber { fill: #231b10; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .h1 { fill: #f8fafc; font: 700 24px 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .sub { fill: #94a3b8; font: 400 13px 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .sec { fill: #38bdf8; font: 700 12px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; letter-spacing: 0.08em; }
      .title { fill: #f1f5f9; font: 600 15px 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .body { fill: #cbd5e1; font: 400 12.5px 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { fill: #7dd3fc; font: 500 12px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .mono-teal { fill: #5eead4; font: 500 12px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .mono-amber { fill: #fcd34d; font: 500 12px 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
      .wire { stroke: #38bdf8; stroke-width: 1.75; fill: none; marker-end: url(#arrow-cyan); }
      .wire-teal { stroke: #2dd4bf; stroke-width: 1.75; fill: none; marker-end: url(#arrow-teal); }
      .wire-dashed { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-slate); }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="860" />

  <!-- Subtle engineering grid -->
  <g>
    <line class="grid-line" x1="0" y1="88" x2="1280" y2="88" />
    <line class="grid-line" x1="0" y1="244" x2="1280" y2="244" />
    <line class="grid-line" x1="0" y1="536" x2="1280" y2="536" />
    <line class="grid-line" x1="0" y1="716" x2="1280" y2="716" />
  </g>

  <!-- Header Banner -->
  <text class="h1" x="40" y="44">WebGL 2.0 Systems Architect — Routed Lane &amp; Execution Blueprint</text>
  <text class="sub" x="40" y="68">Progressive module routing · 5 independent analysis lanes · honest CPU/worker vs single-context GL concurrency · EN / 简体中文 / 日本語 / 한국어</text>
  <rect class="card-cyan" x="1036" y="24" width="204" height="44" rx="8" />
  <text class="mono" x="1056" y="51">v2.0.0 · GLSL ES 3.00</text>

  <!-- ROW 1: Entrypoint, Orchestrator, Triage, Locale Pack -->
  <rect class="panel" x="40" y="104" width="1200" height="124" rx="10" />
  <text class="sec" x="60" y="128">STAGE 01 // ROUTER ENTRYPOINT, LOCALE DISPATCH &amp; TRIAGE CLASSIFICATION</text>

  <rect class="card-cyan" x="60" y="142" width="240" height="68" rx="8" />
  <text class="title" x="78" y="166">Root Router &amp; Wrappers</text>
  <text class="mono" x="78" y="186">SKILL.md (&lt;800 chars)</text>
  <text class="body" x="78" y="202">AGENTS / CLAUDE / GEMINI</text>

  <rect class="card" x="340" y="142" width="260" height="68" rx="8" />
  <text class="title" x="358" y="166">Orchestrator &amp; Locale Tree</text>
  <text class="mono" x="358" y="186">00-orchestrator.md</text>
  <text class="body" x="358" y="202">locales/{zh-CN, ja, ko}/</text>

  <rect class="card-teal" x="640" y="142" width="280" height="68" rx="8" />
  <text class="title" x="658" y="166">Triage Gate (Always First)</text>
  <text class="mono-teal" x="658" y="186">skills/core/01-triage.md</text>
  <text class="body" x="658" y="202">6 intents × 6 project classes</text>

  <rect class="card" x="960" y="142" width="260" height="68" rx="8" />
  <text class="title" x="978" y="166">Canonical Route Table</text>
  <text class="mono" x="978" y="186">registry/module-map.json</text>
  <text class="body" x="978" y="202">Exact module set per intent</text>

  <line class="wire" x1="300" y1="176" x2="338" y2="176" />
  <line class="wire" x1="600" y1="176" x2="638" y2="176" />
  <line class="wire-teal" x1="920" y1="176" x2="958" y2="176" />

